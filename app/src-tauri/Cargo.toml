[package]
name = "localpass"
version.workspace = true
description = "LocalPass: a fully local password manager with LAN sync"
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519).
name = "localpass_lib"
# cdylib for Android, rlib for the desktop exe. No staticlib: only iOS needs it, and each build
# would write one more copy of every dependency (hundreds of MB per profile and target).
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lp-core.workspace = true
lp-engine.workspace = true
lp-sync.workspace = true
lp-broker = { workspace = true, features = ["server", "client"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
zeroize.workspace = true
data-encoding.workspace = true
zxcvbn = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# `image-data`: "Paste QR image" reads a copied screenshot from the clipboard (qr.rs).
arboard = { version = "3", default-features = false, features = ["image-data"] }
# Reading a 2FA setup QR from a picture (qr.rs). Pure Rust; only the formats a screenshot or a
# downloaded QR comes in.
rqrr = { version = "0.11", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }

[target.'cfg(target_os = "linux")'.dependencies]
# "Scan QR on screen": GNOME's screenshot picker through xdg-desktop-portal (qr.rs).
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screenshot"] }
# The device secret and the paired clients are sealed with a key in the desktop keyring.
lp-engine = { workspace = true, features = ["keyring"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# The async types the `windows` crate hands out (already in the dependency tree); needed to
# cancel a pending Windows Hello check.
windows-future.workspace = true

[dev-dependencies]
# qr.rs tests draw QR codes and write picture files.
qrcode.workspace = true
tempfile.workspace = true

[features]
# Used by `tauri dev`/`tauri build` to serve the bundled frontend.
custom-protocol = ["tauri/custom-protocol"]
