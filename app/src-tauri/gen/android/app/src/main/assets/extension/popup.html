<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalPass</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icon-32.png" alt="" width="20" height="20" />
      <strong>LocalPass</strong>
      <span id="site"></span>
    </header>
    <main id="main"><p class="muted">Connecting…</p></main>
    <footer>
      <label class="check"><input type="checkbox" id="passkeys" /> <span>Use LocalPass for passkeys</span></label>
      <label class="check"><input type="checkbox" id="privacy" /> <span>Turn off the browser's own password saving</span></label>
      <div id="privacy-note" class="muted small"></div>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
