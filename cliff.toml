# git-cliff turns Conventional Commits into the changelog and the GitHub release notes.
# `bun scripts/release.ts X.Y.Z` writes CHANGELOG.md with it; release.yml reuses the newest section as the
# release body. https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to LocalPass. Generated from commit messages (Conventional Commits) by git-cliff.
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**BREAKING** {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = false

[git]
conventional_commits = true
# The first commit and anything else without a type still shows up, under "Other".
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^security", group = "Security" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^(test|ci|build|chore|style)", group = "Maintenance" },
  { message = ".*", group = "Other" },
]
