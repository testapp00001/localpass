[package]
name = "lp-winauth"
description = "LocalPass Windows system passkey provider: the packaged COM server that relays WebAuthn plugin requests to the app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# A provider with its own class id, name, data folder and registry key, so the app's set-up code can be
# run against a throwaway package without touching the real registration. Never shipped.
test-identity = []

[[bin]]
name = "lp-winauth-provider"
path = "src/bin/lp-winauth-provider.rs"

[target.'cfg(windows)'.dependencies]
ciborium.workspace = true
data-encoding.workspace = true
# Only the client side of the broker: the provider must not link the engine, sync or storage crates.
lp-broker = { workspace = true, features = ["client"] }
lp-core.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
windows.workspace = true
windows-core.workspace = true
# DPAPI (client.bin), the HKCU app path, GetNamedPipeServerProcessId, AllowSetForegroundWindow.
windows-sys = { workspace = true, features = [
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
zeroize.workspace = true

[target.'cfg(windows)'.dev-dependencies]
p256.workspace = true
proptest.workspace = true
tempfile.workspace = true

[[example]]
name = "com_probe"
