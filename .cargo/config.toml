# Android 15+ phones may use 16 KB memory pages. A shared library whose segments are
# aligned to 4 KB fails to load there, and NDK r27 does not align them by default.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
