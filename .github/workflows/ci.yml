name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The Tauri crate embeds the built web app and the extension at compile time.
      - run: bun install --frozen-lockfile && bun run build && bun run build:extension
        working-directory: app
      - run: bun install --frozen-lockfile
        working-directory: extension
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # lp-broker's helper tests start an example binary that only a whole-crate `cargo test` builds.
      - run: '[Environment]::OSVersion.VersionString; (Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion").DisplayVersion'
      - run: cargo test --workspace --exclude lp-winauth --no-fail-fast
      # The hosted runner is Windows Server 2025 (24H2), whose webauthn.dll answers E_NOTIMPL to the passkey
      # plugin API (decode/encode, authenticator state). These tests need a Windows 11 with that API and are
      # run on the developer PC instead (docs/handoff-phase4-5.md); everything else in lp-winauth runs here.
      - run: >-
          cargo test -p lp-winauth --no-fail-fast --
          --skip handler::tests --skip sys::api_tests --skip translate::tests
          --skip pair_create_list_assert_end_to_end
          --skip a_locked_vault_is_unlocked_by_the_app_for_a_sign_in_but_never_for_listing
          --skip a_provider_the_app_does_not_know_is_refused
          --skip when_the_app_goes_away_requests_fail_fast_as_device_not_found

  linux:
    name: Linux (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The Tauri crate embeds the built web app and the extension at compile time.
      - run: bun install --frozen-lockfile && bun run build && bun run build:extension
        working-directory: app
      - run: bun install --frozen-lockfile
        working-directory: extension
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # lp-broker's helper tests start an example binary that only a whole-crate `cargo test` builds.
      - run: cargo test --workspace --exclude lp-winauth --no-fail-fast
      # The Firefox add-on in a real headless Firefox (the runner image has one), through the real native-messaging helper.
      - run: cargo build -p lp-broker --examples
      - run: firefox --version && bun run build --firefox --e2e && bun run e2e/firefox/run.ts
        working-directory: extension

  web:
    name: Web app and extension (types, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile && bun run build && bun test
        working-directory: app
      - run: bun install --frozen-lockfile && bunx tsc --noEmit && bun test
        working-directory: extension
